# /misc/survey/reciprocal-rec/ のデータ。論文は papers に追記するだけで表に出る（年の降順で自動ソート）。
# category は categories の id のどれか。確認できなかった項目は "" のままにする。
# id は系譜の図と矢印で使う識別子、short は図での呼び名（論文を足すときは必ず付ける）。
# explainer を書くと papers/<explainer>/ の解説ページへリンクする。groups は lineage_groups の id。

updated: "2026-11-28"

intro: "求人サービスやオンラインデートのように、利用者に別の利用者を推薦する双方向市場（二面市場）の推薦の文献をまとめたページです。ふつうの推薦はアイテムを薦められた利用者が選べば成功ですが、双方向市場では薦められた相手も応じたときにだけマッチングが成立します。そのため、双方の選好をどう組み合わせるか、人気のある利用者に推薦が集中する混雑をどう避けるか、両側の機会をどう公平に配るかが問題になります。相互推薦の手法、マッチング理論、混雑と公平性、オフ方策評価、求人とオンラインデートの応用を中心に、論文・データセット・評価指標・ライブラリを表にしました。"

categories_note: "論文の表の「系統」は主な貢献で1つに決めています。複数の系統にまたがる論文もあります。"

papers_note: "「領域」は対象のサービス、「双方の選好」は両側の選好をどう推定し組み合わせるか、「評価」は理論・シミュレーション・オフライン評価・オンライン実験のどれで検証したかです。会議名とリンクは arXiv や出版社のページで確認できたものだけを載せています。"

explainer_note: "「解説」列のリンク先は、西村直樹が論文を読んでまとめた非公式の解説ページです（著者の公式ページではありません）。"

datasets_note: "相互推薦や求人推薦の実験に使える公開データです。両側の反応（送った好意と返した好意、応募と採用）がそろったデータは少なく、合成データで実験する論文も多くあります。"

metrics_note: "双方向市場では、片側の利用者の満足だけでなく、マッチングの成立数、推薦の集中、両側の機会の公平性を合わせて見ます。"

footer: "掲載している情報は各論文の arXiv・出版社・Crossref のページで確認した内容にもとづきます。"

categories:
  - id: reciprocal
    label: "相互推薦"
    color: "#0969da"
    idea: "利用者ごとに「相手への関心」と「相手からの関心」を推定し、調和平均などで1つのスコアにまとめて順位づける。RECON から続く研究の流れ"
    setting: "既存の推薦モデルを双方向の市場に広げたいとき"
    examples: "RECON (2010), Neve & Palomares (2019), Zheng et al. (2023)"
  - id: market-ranking
    label: "市場全体の順位最適化"
    color: "#cf222e"
    idea: "利用者ごとのスコアで並べるのではなく、全員への推薦リストを同時に決めて市場全体の期待マッチ数を最大化する。閲覧確率と容量の制約をモデルに入れる"
    setting: "推薦が人気の利用者に集中してマッチ数が伸びないとき"
    examples: "Su et al. (2022), Tomita et al. (2023), Tomita (2026)"
  - id: matching
    label: "マッチング理論"
    color: "#8250df"
    idea: "安定マッチングや最適輸送の考え方で、双方の選好から推薦やマッチングを決める。観測されたマッチングから選好を逆に推定する研究もある"
    setting: "容量のある多対多の市場で、理論にもとづいて推薦を決めたいとき"
    examples: "Li et al. (2019), Nakada et al. (2024), Sekiya et al. (2026)"
  - id: bandit
    label: "学習しながらのマッチング"
    color: "#0a7f86"
    idea: "選好が分からない状態から、マッチングを繰り返しながら選好を学ぶ。マッチング市場のバンディット問題として後悔（regret）の上界を示す"
    setting: "新しい利用者が多く、選好を探索しながら推薦するとき"
    examples: "Liu et al. (2020), Johari et al. (2021)"
  - id: congestion
    label: "混雑と容量制約"
    color: "#bc4c00"
    idea: "一部の求人や人気の利用者に応募や好意が集中する混雑を、露出の再配分、容量制約、選択肢の制限で抑える。経済学・OR の研究が多い"
    setting: "応募や連絡が一部に集中し、返事がもらえない利用者が多いとき"
    examples: "Arnosti et al. (2021), Borisyuk et al. (2017), Rios et al. (2023)"
  - id: fairness
    label: "両側の公平性"
    color: "#bf3989"
    idea: "利用者側の満足と提供者側の露出の両方について公平性を定め、そのもとで推薦を最適化する"
    setting: "提供者や求職者の機会の偏りが問題になるとき"
    examples: "Patro et al. (2020), Do et al. (2021), Saito & Joachims (2022)"
  - id: causal
    label: "オフ方策評価・因果推論"
    color: "#3d5a80"
    idea: "過去の推薦のログから新しい方策の成果を推定する。両側の位置バイアスの補正、マッチングの疎らさに対応した推定量、二面市場の A/B テストの偏りを扱う"
    setting: "A/B テストを頻繁に回せないとき、ログの偏りを補正したいとき"
    examples: "Oh et al. (2023), Hayashi et al. (2025), Johari et al. (2022)"
  - id: job
    label: "求人推薦"
    color: "#1a7f37"
    idea: "求職者と求人の適合（person-job fit）を、職務経歴書や求人票の文章と行動の履歴から学習する。RecSys Challenge 2016/2017 や労働経済学のフィールド実験を含む"
    setting: "求人・採用の領域に特有のデータや評価を知りたいとき"
    examples: "RecSys Challenge 2016/2017, Qin et al. (2018), Yang et al. (2022)"
  - id: dating
    label: "オンラインデートの実証"
    color: "#9a6700"
    idea: "オンラインデートの利用者の選好と行動を実データやフィールド実験で分析する。推薦の設計の前提になる知見"
    setting: "デートの領域で利用者がどう相手を選ぶかを知りたいとき"
    examples: "Hitsch et al. (2010), Lee & Niederle (2015)"

# ---- 系譜（/misc/survey/reciprocal-rec/ の「系譜」の図）----
# from → to は「to が from を引き継いだ」。slug は papers の id。
# kind: ext = 引き継いで発展（直接の拡張・改良、同じグループの続編）、base = 比較・出発点（ベースライン、最も近い先行研究）。
# why は論文本文の記述にもとづく一言。データセットや評価指標を使っただけの関係は載せない。
# guess: true は解説者の推測で、本文ではまだ確認していない矢印（図では点線、表では「推測」と出る）。確認したら消す。
# lineage_lanes は図の上から下への系統の並び。
lineage_first_year: 2017
lineage_lanes: [reciprocal, market-ranking, matching, causal, fairness, congestion, bandit, job, dating]

# lineage_groups は図の上の「研究グループ」のボタン。論文の groups に id を書く（著者の所属から決める。共同研究は両方に入れる）。
lineage_groups:
  - { id: cornell, label: "Cornell（Joachims）" }
  - { id: cyberagent, label: "CyberAgent（Tomita）" }
  - { id: recruit, label: "リクルート・東工大（西村・中田）" }
  - { id: sony, label: "ソニー（Kawamura）" }
  - { id: berkeley, label: "UC Berkeley（Jordan）" }
  - { id: kanoria, label: "Columbia・Stanford（Kanoria・Johari）" }
  - { id: linkedin, label: "LinkedIn" }
  - { id: mpi-sws, label: "MPI-SWS（Gummadi・Chakraborty）" }
  - { id: ruc, label: "中国人民大学（Zhao）" }
  - { id: sydney, label: "Sydney（Pizzato・Kay）" }

lineage_note: "横は年、縦は系統です。矢印は古い論文から、それを引き継いだ新しい論文へ向かいます。実線は手法や結果を直接拡張・改良した関係か、同じグループの続編です。破線は実験で比較した関係か、最も近い先行研究・出発点に挙げた関係です。論文の本文で確認できた関係を描いており、データセットや評価指標を使っただけの関係は描いていません。点線の矢印は解説者の推測で、本文ではまだ確認していません。2016 年以前の論文は左端の1列にまとめています。研究グループは著者の所属から決めており、共同研究の論文は両方のグループに入れています。破線の枠は解説ページのない論文です。論文をクリックすると解説ページへ移動します。これは初版で、本文を確認できた論文はまだ一部です。"

lineage:
  - { from: tu-2014, to: su-2022, kind: base, why: "最も近い先行研究に挙げ、推薦がすべて見られるという仮定を外して、順位で見られる確率が変わるモデルにする" }
  - { from: su-2022, to: tomita-2023, kind: base, why: "Su らの期待マッチ数の最適化（SW）を主な比較相手とし、計算量と見る確率の関数への依存を問題にする" }
  - { from: neve-palomares, to: tomita-2023, kind: base, why: "両側の関心の積で並べる方法（Neve & Palomares らの集約）をベースラインにする" }
  - { from: tomita-2023, to: fair-reciprocal, kind: ext, why: "同じグループ。TU マッチングによる順位をベースラインとして比べ、両側の公平性を加える" }
  - { from: su-2022, to: fair-reciprocal, kind: base, why: "相互推薦を後処理の最適化として定式化した先行研究に挙げ、合成データの作り方を踏襲する" }
  - { from: fair-division, to: fair-reciprocal, kind: ext, why: "Saito & Joachims のインパクトにもとづく公平性とナッシュ社会厚生の方法を、双方向の推薦に広げる" }
  - { from: neve-palomares, to: fair-reciprocal, kind: base, why: "両側の関心の積で並べる方法（Prod）をベースラインにする" }
  - { from: fair-reciprocal, to: tomita-nsw-2026, kind: ext, why: "同じ著者ら。NSW による公平な相互推薦に、公平性とマッチ率を調整する α-SW と Sinkhorn による近似アルゴリズムを加える", guess: true }
  - { from: su-2022, to: mode, kind: ext, why: "Su らの順位の定式化の上に組み立て、その近似の期待マッチ数を比較相手（ApproxSW）にする" }
  - { from: tomita-2023, to: mode, kind: ext, why: "同じ著者。TU マッチングによる順位に改善の余地があるとして発展させ、比較相手にする" }
  - { from: tomita-2023, to: parallel-stable, kind: ext, why: "TU マッチングの推論を引き継ぎ、全員の組をメモリに持つ必要があるという制約をミニバッチで解く" }
  - { from: su-2022, to: parallel-stable, kind: base, why: "ベースラインとして試したが、最適化が現実的な時間で終わらず結果は載せていない" }
  - { from: neve-palomares, to: parallel-stable, kind: base, why: "Neve & Palomares の cross-ratio の集約をベースラインにする" }
  - { from: neve-palomares, to: counterfactual-rrs, kind: base, why: "選択の偏りを考えない潜在因子モデルの相互推薦（LFRR）をベースラインにする" }
  - { from: neve-palomares, to: reseq, kind: base, why: "潜在因子モデルの相互推薦（LFRR）をベースラインにする" }
  - { from: dpgnn, to: reseq, kind: base, why: "DPGNN をベースラインにし、評価の手順も DPGNN にならう" }
  - { from: pjfnn, to: reseq, kind: base, why: "CNN による求職者と求人の適合（PJFNN）をベースラインにする" }
  - { from: apjfnn, to: reseq, kind: base, why: "Qin らの person-job fit のモデルをベースラインにする" }
  - { from: rios-2023, to: sekiya-2026, kind: base, why: "ログインの確率と履歴の効果を組み合わせた品ぞろえの最適化を、最も近い例外的な先行研究に挙げる" }
  - { from: fairness-exposure, to: wang-joachims-2021, kind: ext, why: "同じグループ。露出の公平性の制約を、提供者の側の公平性の定義に使う" }
  - { from: fairness-exposure, to: fair-division, kind: ext, why: "同じグループ。露出を配分する後処理の枠組みを踏襲し、露出の公平性がインパクトの公理を満たさないことを示す" }
  - { from: fairrec, to: fair-division, kind: base, why: "最も近い先行研究に挙げ、位置による偏りを扱わない点を違いとする" }
  - { from: fairrec, to: lorenz-fairness, kind: base, why: "FairRec をベースラインとして比べる" }
  - { from: fairness-exposure, to: lorenz-fairness, kind: base, why: "露出の平等と質で重みづけた露出の基準をベースラインにする" }
  - { from: wang-joachims-2021, to: lorenz-fairness, kind: base, why: "最も近い関連研究に挙げる", guess: true }
  - { from: fair-division, to: coupon-allocation, kind: base, why: "インパクトの積を最大化する方法（NSW モデル）を比較する配分法の1つにする" }
  - { from: competing-bandits, to: decentralized-bandit, kind: ext, why: "同じグループ。中央で調整する設定の方法を、分散型の市場に広げる" }
  - { from: recon, to: pizzato-2013, kind: ext, why: "同じグループ。RECON をもとに、相互推薦とアイテムの推薦の違いを整理する", guess: true }
  - { from: neve-palomares, to: imrec, kind: ext, why: "同じ著者。潜在因子モデルの相互推薦を、画像から選好を学ぶ方法に広げる", guess: true }
  - { from: pjfnn, to: apjfnn, kind: ext, why: "同じグループ。求職者と求人の表現の同時学習に、能力を考える仕組みを加える", guess: true }
  - { from: mv-cotn, to: dpgnn, kind: ext, why: "同じグループ。求人と職務経歴書のマッチングを、双方向の選好のグラフに広げる", guess: true }
  - { from: recsys-challenge-2016, to: recsys-challenge-2017, kind: ext, why: "同じ主催者による翌年の求人推薦のコンペで、オンライン評価を加える", guess: true }

