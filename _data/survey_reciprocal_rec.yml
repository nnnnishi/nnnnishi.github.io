metrics:
  - name: "期待マッチ数"
    what: "推薦リストの各位置が閲覧される確率と、双方が好意を示す確率から、市場全体で成立するマッチングの数の期待値を計算する。市場全体の順位最適化の目的関数になる"
    refs: "Su et al. (2022), Tomita et al. (2023)"
  - name: "相互の成立を正解にした適合率・再現率"
    what: "双方が関心を示した組だけを正解として、上位 k 件の適合率や再現率を計算する。片側の関心だけを正解にした指標より、マッチングの成立に近い"
    refs: "Pizzato et al. (2010, 2013)"
  - name: "両側の位置バイアスを補正した順位指標"
    what: "両側の利用者の位置バイアスを逆傾向スコアで補正し、偏ったログからでも真の順位指標を不偏に推定する"
    refs: "Oh et al. (2023)"
  - name: "オフ方策評価によるマッチ数の推定"
    what: "過去の方策のログから、新しい方策のもとでのマッチ数を推定する。マッチングは疎らなので、最初の反応などの中間ラベルで分散を下げる"
    refs: "Hayashi et al. (2025)"
  - name: "推薦の集中度（混雑）"
    what: "露出や応募が一部の利用者・求人にどれだけ集中しているかを、ジニ係数や応募数の分布で測る"
    refs: "Borisyuk et al. (2017), Mashayekhi et al. (2024), Kawamura et al. (2025)"
  - name: "混雑を割り引いたマッチ数"
    what: "受け取る好意が多すぎる受け手とのマッチングを割り引いて数える。返事が追いつかない受け手とのマッチングで効率を過大に見積もることを避ける"
    refs: "Sekiya et al. (2026)"
  - name: "露出の公平性"
    what: "提供者や推薦される側の利用者が受ける露出（閲覧される確率の和）が、関連度などに比べて偏っていないかを測る"
    refs: "Singh & Joachims (2018), Patro et al. (2020), Do et al. (2021)"
  - name: "嫉妬のなさ・ナッシュ社会厚生"
    what: "ほかの利用者が受けた推薦の機会を自分が受けたほうがよかったと感じる利用者がいないかを測る。ナッシュ社会厚生の最大化で嫉妬のない配分に近づける"
    refs: "Saito & Joachims (2022), Tomita & Yokoyama (2024)"
  - name: "A/B テストの干渉による偏り"
    what: "二面市場の A/B テストで、処置群と対照群が同じ相手を奪い合うことで生じる効果の推定の偏り"
    refs: "Johari et al. (2022)"

