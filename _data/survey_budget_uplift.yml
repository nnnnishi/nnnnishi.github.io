metrics:
  - name: "Uplift 曲線 / AUUC"
    axes: 処置する人の割合 → 累積の増分（処置群と対照群の差）
    what: 優先度順に処置したときの効果の総量。曲線の下の面積（AUUC）で手法を比べる
    refs: Gutierrez & Gérardy (2017), Devriendt et al. (2022)
  - name: "Qini 曲線 / Qini 係数"
    axes: 処置する人数 → 増分の購買数
    what: Uplift 曲線とほぼ同じだが、対照群の結果を処置群の人数に合わせて差し引く。ランダムな順序との差の面積が Qini 係数
    refs: Yadlowsky et al. (2025), Bokelmann et al. (2024)
  - name: "コスト曲線 / AUCC"
    axes: 累積の増分コスト → 累積の増分売上（どちらも全員に処置したときを1とする）
    what: 予算に対する効率。ROI の順位がどれだけ正しいかを測る。予算制約がある場合はこの曲線が意思決定に対応する
    refs: Du et al. (2019), Zhou et al. (2023, DRP)
  - name: "予算ごとの利得"
    axes: 予算（全員に処置したときのコストに対する比） → 予算内で割り当てたときの増分売上・利益
    what: 特定の予算での性能を見る。決定志向の手法は、この値（の期待値）を学習の目的にすることが多い
    refs: Zhou et al. (2024, DFCL), Sun et al. (2024, E3IR)
  - name: "Profit Qini"
    axes: 処置する人の割合 → 累積の増分利益
    what: 売上ではなくコストを差し引いた利益で Qini 曲線を描く
    refs: Proença & Moraes (2023, IPC)
  - name: "RATE（AUTOC / Qini 重み）"
    axes: 優先度の上位 q → 上位 q の平均効果と全体の平均効果の差
    what: 順位加重の平均処置効果。優先順位の良さを信頼区間つきで検定できる
    refs: Yadlowsky et al. (2025)
  - name: "多処置の Qini 曲線"
    axes: 予算 → 複数の処置から予算内で最適に選んだときの利得
    what: コストの違う複数の処置をまとめて評価する
    refs: Sverdrup et al. (2024)

resources:
