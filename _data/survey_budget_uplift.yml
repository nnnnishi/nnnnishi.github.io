lineage_note: "横は年、縦は系統です。矢印は古い論文から、それを引き継いだ新しい論文へ向かいます。実線は手法や結果を直接拡張・改良した関係か、同じグループの続編です。破線は実験で比較した関係か、最も近い先行研究・出発点に挙げた関係です。論文の本文や解説ページで確認できた関係だけを描いており、データセットや評価指標を使っただけの関係は描いていません。＊のついた論文は arXiv の初版の年に置いています。2017 年以前の論文は左端の1列にまとめています。研究グループは解説ページに載せた著者の所属から決めており、共同研究の論文は両方のグループに入れています。"

