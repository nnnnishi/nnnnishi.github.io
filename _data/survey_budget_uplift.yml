# /misc/survey/budget-uplift/ のデータ。論文は papers に追記するだけで表に出る（年の降順で自動ソート）。
# category は categories の id のどれか。確認できなかった項目は "" のままにする。
# short は「系譜」の図での呼び名（論文を足すときは必ず付ける）。図の矢印は lineage に足す。
# preprint_year を書くと、図ではその年の列に置く（掲載より先に arXiv 版が引用されている論文）。

updated: "2026-11-26"

intro: "クーポンやポイントなどのインセンティブを、予算の範囲で誰に配るかを決める問題の文献をまとめたページです。処置にコストがかかるとき、売上の増分をコストの増分で割った値（ROI）の大きい順に配る割当てが、ナップザック問題を連続緩和した問題の最適解になります。この ROI をどう推定し、どう割り当てるかを中心に、論文・データセット・評価指標・ライブラリを表にしました。"

categories_note: "論文の表の「系統」は主な貢献で1つに決めています。複数の系統にまたがる論文もあります。"

papers_note: "「処置」は扱う処置の種類（二値・多値・連続）、「コスト」はコストがいつ・どう発生するかです。会議名とリンクは arXiv や出版社のページで確認できたものだけを載せています。"

explainer_note: "「解説」列のリンク先は、西村直樹が論文を読んでまとめた非公式の解説ページです（著者の公式ページではありません）。"

datasets_note: "予算制約やコストを考慮した実験に使える公開データです。売上額まで公開されている RCT データは Hillstrom だけで、ほかは結果が0/1です。"

metrics_note: "どの指標も優先度の高い順に処置したときの利得を、処置する量の関数として描いた曲線にもとづきます。予算制約がある場合は、横軸をコストにした曲線が実際の意思決定に対応します。"

footer: "掲載している情報は各論文の arXiv・出版社のページで確認した内容にもとづきます。"

categories:
  - id: foundation
    label: 基礎
    color: "#6e7781"
    idea: 予算付きの割当てを考えるうえでの前提。効果の推定精度より順位の正しさが重要であることや、売上のアップリフトの推定方法など
    setting: 問題設定を整理したいとき
    examples: Fernández-Loría & Provost (2022), Gubela et al. (2020)
  - id: two-stage
    label: 二段階
    color: "#0969da"
    idea: 売上の増分とコストの増分を別々のモデルで推定し、その比やナップザック問題で割り当てる
    setting: 既存のアップリフトモデルをそのまま使いたいとき
    examples: Free Lunch (2020), Haupt & Lessmann (2022), Verbeke et al. (2023)
  - id: direct-ratio
    label: 比の直接学習
    color: "#cf222e"
    idea: ROI（売上の増分 ÷ コストの増分）を1つのモデルで直接推定する。2つの推定値を割り算して誤差が大きくなるのを避ける
    setting: 二値の処置を ROI の順に配るとき
    examples: Direct Rank (2019), DRP (2023), IPC (2023)
  - id: ranking
    label: 順位の学習
    color: "#8250df"
    idea: 効果の値ではなく順位を、ランキング学習で直接最適化する。AUUC などの曲線の面積を目的関数にする
    setting: 上位から順に配るので、順位だけ合えばよいとき
    examples: Devriendt et al. (2022), Metalearners for Ranking (2024), Rank-Learner (2026)
  - id: decision-focused
    label: 決定志向
    color: "#bf3989"
    idea: 予測と最適化を分けず、割当ての結果（予算内での総利得）を損失として学習する
    setting: 多値の処置や大規模データで、割当ての質を直接上げたいとき
    examples: DFCL (2024), E3IR (2024), Bi-DFCL (2025)
  - id: tree
    label: 木モデル
    color: "#1a7f37"
    idea: 予算制約を考慮した因果フォレストで処置効果を推定し、処置を選ぶ
    setting: 分散処理で大規模データを扱うとき
    examples: LBCF (2022)
  - id: multi-treatment
    label: 多値処置・MCKP
    color: "#bc4c00"
    idea: 額や種類の違う複数のクーポンから1つを選ぶ。多肢選択ナップザック問題（MCKP）をラグランジュ緩和などで解く
    setting: クーポンの額面が複数あるとき
    examples: Zhao & Harinen (2019), FunnelCausalNet (2026)
  - id: policy
    label: 方策学習
    color: "#0a7f86"
    idea: 予算や処置割合の制約のもとで処置ルールを学習し、後悔（regret）や厚生の理論保証を示す。計量経済学・統計学の系統
    setting: 理論保証が欲しいとき、観察データから学ぶとき
    examples: Kitagawa & Tetenov (2018), Athey & Wager (2021)
  - id: online
    label: オンライン・逐次
    color: "#9a6700"
    idea: 予算を時間とともに消化しながら配る。オンラインのナップザック、バンディット、制約付き強化学習
    setting: リアルタイムに配布を決めるとき、長期の効果を見るとき
    examples: Albert & Goldenberg (2022), BCORLE(λ) (2021)
  - id: evaluation
    label: 評価方法
    color: "#3d5a80"
    idea: 予算ごとの利得曲線（Qini、AUUC、AUCC、RATE）の性質や推定の分散、ベンチマーク
    setting: 手法を比べる実験を設計するとき
    examples: Yadlowsky et al. (2025), Sverdrup et al. (2024)

# ---- 系譜（/misc/survey/budget-uplift/ の「系譜」の図）----
# from → to は「to が from を引き継いだ」。slug は papers の explainer（解説のない論文は id）。
# kind: ext = 引き継いで発展（直接の拡張・改良、同じグループの続編）、base = 比較・出発点（ベースライン、最も近い先行研究）。
# why は論文本文の記述にもとづく一言。データセットや評価指標を使っただけの関係は載せない。
# lineage_lanes は図の上から下への系統の並び。実線の矢印が短くなる順にしている。
lineage_lanes: [ranking, evaluation, policy, foundation, tree, decision-focused, direct-ratio, two-stage, online, multi-treatment]

