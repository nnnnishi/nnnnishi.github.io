  - { from: contextual-treatment-selection, to: multi-treatment-cost, kind: base, why: "CTS を多値処置の既存手法として比較に含める" }
  - { from: policy-learning-observational, to: multi-action-policy-learning, kind: ext, why: "二値の処置に限られていた二重頑健な方策学習を、多値の行動に拡張する" }
  - { from: empirical-welfare-maximization, to: multi-action-policy-learning, kind: base, why: "後悔の上界の比較対象と、1/√n の下界の出典に挙げる" }
  - { from: multi-action-policy-learning, to: multi-armed-qini, kind: base, why: "多値処置の二重頑健スコアの形と、3 処置のシミュレーションの設定を借りる" }
  - { from: multi-action-policy-learning, to: roi-conformal, kind: base, why: "資源の制約をラグランジュ乗数で報酬に入れる方策学習の例に挙げ、予算が変わるたびに学習し直す必要がある点を課題にする" }
  - { from: disco, to: budget-causal-bandits, kind: base, why: "最も近い同時期の研究に挙げ、CATE を推定しない点を違いとする" }
  - { from: disco, to: action-centered-bandits, kind: base, why: "応用で最も近いシステムに挙げ、報酬モデルを学ぶ点とリグレットの保証がない点を違いとする" }
  - { from: online-mckp, to: lcm-promo, kind: base, why: "A/B テストの両群で使う線形最適化の配分器の出典に挙げる" }
  - { from: bcorle, to: goal-generative, kind: base, why: "BCORLE の λ 汎化の考え方を、生成方策の最適化に組み込む" }

