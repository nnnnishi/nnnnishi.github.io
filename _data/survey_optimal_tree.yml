# /misc/survey/optimal-tree/ のデータ。論文は papers に追記するだけで表に出る（年の降順で自動ソート）。
# category は categories の id のどれか。確認できなかった項目は "" のままにする。
# id は系譜の図と矢印で使う識別子、short は図での呼び名（論文を足すときは必ず付ける）。
# explainer を書くと papers/<explainer>/ の解説ページへリンクする。
# preprint_year を書くと、図ではその年の列に置く（掲載より先に arXiv 版が引用されている論文）。

updated: "2026-11-28"

intro: "決定木を貪欲法ではなく目的関数を最適にするように学習する研究（最適決定木）の文献をまとめたページです。CART などの貪欲法は分岐を1つずつ決めるので、深さや葉の数を決めたときの最良の木が得られるとは限りません。最適決定木の研究は木全体を混合整数最適化、動的計画法と分枝限定法、SAT・制約プログラミング、連続最適化などで一度に決めます。解き方の系統ごとに、論文・データセット・評価指標・ライブラリを表にしました。"

categories_note: "論文の表の「系統」は主な貢献で1つに決めています。複数の系統にまたがる論文もあります。"

papers_note: "「分岐」は1つの特徴量でしきい値を決める単変量（軸に平行な分岐）か、複数の特徴量の線形結合で分ける多変量（斜めの分岐）か、「目的・制約」は何を最適にし、何を制約にするかです。会議名とリンクは arXiv や出版社のページで確認できたものだけを載せています。"

explainer_note: "「解説」列のリンク先は、西村直樹が論文を読んでまとめた非公式の解説ページです（著者の公式ページではありません）。"

datasets_note: "最適決定木の実験でよく使われる公開データです。動的計画法や SAT の系統は二値の特徴量を前提にすることが多く、連続の特徴量をしきい値で二値化したデータ（DL8 の論文で使われたものなど）が共通のベンチマークになっています。"

metrics_note: "最適決定木の論文では、テストデータでの精度に加えて、最適性を証明できたか、何秒で解けたか、どれだけ小さな木で済むかを比べます。"

footer: "掲載している情報は各論文の arXiv・出版社のページで確認した内容にもとづきます。"

categories:
  - id: foundation
    label: 基礎
    color: "#6e7781"
    idea: 最適な木を求める問題の計算量や、解釈できるモデルを使う理由など、最適決定木の研究の前提
    setting: 問題設定と動機を整理したいとき
    examples: Hyafil & Rivest (1976), Rudin (2019)
  - id: mio
    label: 混合整数最適化
    color: "#0969da"
    idea: 各ノードの分岐と各データの行き先を整数変数で表し、深さを決めた木全体を MIO ソルバーで解く。多変量の分岐や制約を足しやすい
    setting: 制約や独自の目的関数を入れたいとき、多変量の分岐を使いたいとき
    examples: Bertsimas & Dunn (2017), Verwer & Zhang (2019), Aghaei et al. (2025)
  - id: dp-bnb
    label: 動的計画法・分枝限定
    color: "#1a7f37"
    idea: 部分木がそこに届くデータだけで決まる性質を使い、部分問題をキャッシュしながら分枝限定法で探索する。二値の特徴量では MIO より桁違いに速い
    setting: 単変量の分岐で、大きめのデータを厳密に解きたいとき
    examples: DL8.5 (2020), GOSDT (2020), MurTree (2022)
  - id: sat-cp
    label: SAT・制約プログラミング
    color: "#8250df"
    idea: 木の構造を論理式や制約で表し、SAT・MaxSAT ソルバーや制約プログラミングで解く。データを誤りなく分ける最小の木を求める研究から始まった
    setting: 最小の木を求めたいとき、論理的な制約を入れたいとき
    examples: Bessiere et al. (2009), Narodytska et al. (2018), Avellaneda (2020)
  - id: continuous
    label: 連続最適化
    color: "#bc4c00"
    idea: 分岐を確率的で滑らかなものに緩和するか、ノードごとに交互に最適化して、木全体を勾配法などの連続最適化で学習する。厳密な最適性の保証はない
    setting: 多変量の分岐で、大規模なデータを扱いたいとき
    examples: Norouzi et al. (2015), TAO (2018), ORCT (2021)
  - id: regression
    label: 回帰・生存時間
    color: "#9a6700"
    idea: 分類以外の目的変数（連続値、打ち切りのある生存時間）に最適決定木を広げる
    setting: 回帰や生存時間解析で解釈できるモデルが欲しいとき
    examples: Optimal Survival Trees (2022), OSRT (2023)
  - id: prescriptive
    label: 処方的・方策木
    color: "#bf3989"
    idea: 予測ではなく意思決定（どの処置を選ぶか）の良さを目的にして木を学習する。観察データからの方策学習や、予測してから最適化する枠組みと結びつく
    setting: 処置の割当てや意思決定のルールを木で表したいとき
    examples: Kallus (2017), Optimal Prescriptive Trees (2019), Athey & Wager (2021)
  - id: robust-fair
    label: 頑健性・公平性
    color: "#cf222e"
    idea: 敵対的な摂動や分布の変化への頑健性、グループ間の公平性の制約を最適決定木に入れる
    setting: 公平性の制約や頑健性が求められる意思決定に使うとき
    examples: Aghaei et al. (2019), Vos & Verwer (2022), van der Linden et al. (2022)
  - id: rashomon
    label: ラショモン集合・評価
    color: "#3d5a80"
    idea: ほぼ最適な木をすべて列挙して比べる研究や、最適な木と貪欲な木を同じ条件で比べるベンチマーク
    setting: 最適な木が1つに決まらないとき、手法の比較実験を設計するとき
    examples: TreeFARMS (2022), van der Linden et al. (2024)

# ---- 系譜（/misc/survey/optimal-tree/ の「系譜」の図）----
# from → to は「to が from を引き継いだ」。slug は papers の id。
# kind: ext = 引き継いで発展（直接の拡張・改良、同じグループの続編）、base = 比較・出発点（ベースライン、最も近い先行研究）。
# why は論文本文の記述にもとづく一言。データセットや評価指標を使っただけの関係は載せない。
# lineage_lanes は図の上から下への系統の並び。
lineage_first_year: 2017
lineage_lanes: [foundation, sat-cp, dp-bnb, rashomon, mio, robust-fair, prescriptive, regression, continuous]

# lineage_groups は図の上の「研究グループ」のボタン。論文の groups に id を書く（著者の所属から決める。共同研究は両方に入れる）。
lineage_groups:
  - { id: mit, label: "MIT（Bertsimas）" }
  - { id: duke, label: "Duke（Rudin・Seltzer）" }
  - { id: delft, label: "TU Delft（Demirović）" }
  - { id: louvain, label: "UCLouvain（Nijssen・Schaus）" }
  - { id: usc, label: "USC（Vayanos）" }
  - { id: sevilla, label: "Sevilla・CBS（Carrizosa・Romero Morales）" }
  - { id: stanford, label: "Stanford（Athey・Wager）" }

lineage_note: "横は年、縦は系統です。矢印は古い論文から、それを引き継いだ新しい論文へ向かいます。実線は手法や結果を直接拡張・改良した関係か、同じグループの続編です。破線は実験で比較した関係か、最も近い先行研究・出発点に挙げた関係です。論文の本文で確認できた関係だけを描いており、データセットや評価指標を使っただけの関係は描いていません。＊のついた論文は arXiv の初版の年に置いています。2016 年以前の論文は左端の1列にまとめています。研究グループは著者の所属から決めており、共同研究の論文は両方のグループに入れています。破線の枠は解説ページのない論文です。論文をクリックすると解説ページへ移動します。"

