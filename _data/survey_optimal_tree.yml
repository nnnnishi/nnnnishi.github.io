    note: 目的関数の値が最適値から一定以内の疎な木（ラショモン集合）をすべて列挙して保存し、特徴量の重要度などを木の集合全体で調べられるようにする
  - id: optimal-vs-greedy
    title: "Optimal or greedy decision trees? Revisiting their objectives, tuning, and performance"
    authors: "J. G. M. van der Linden, D. Vos, M. M. de Weerdt, S. Verwer, E. Demirović"
    year: 2026
    venue: "TMLR"
    url: "https://openreview.net/forum?id=DvDOAtskXl"
    explainer: optimal-vs-greedy
    preprint_year: 2024
    short: "最適 vs 貪欲"
    groups: [delft]
    code: "https://github.com/ConSol-Lab/opt-vs-greedy-dts"
    category: rashomon
    split: 単変量
    objective: 7 つの目的関数と 5 つの調整方法を比較
    method: ベンチマーク
    data: OpenML の 109 データと合成データ
    note: 最適な木と貪欲な木を、目的関数とハイパーパラメータの調整をそろえて多数のデータで比べ、どのような場合に最適な木の精度が高いかを調べる

datasets:
  - name: "DL8 のベンチマーク（CP4IM）"
    provider: "Nijssen ら（CP4IM）"
    url: "https://github.com/aia-uclouvain/pydl8.5/tree/master/datasets"
    features: 二値化した特徴量
    target: 2クラス
    size: CP4IM の 16 個（anneal, audiology, hepatitis, kr-vs-kp, splice など。DL8.5 の配布版は 24 個）。数百〜8,124 行
    usage: 動的計画法・SAT・CP の系統の共通のベンチマーク。DL8.5、MurTree、STreeD などが使う。リンク先は DL8.5 のリポジトリの配布版
  - name: "UCI Machine Learning Repository"
    provider: "UC Irvine"
    url: "https://archive.ics.uci.edu/"
    features: 連続・カテゴリ
    target: 多クラス・連続値
    size: データによる
    usage: MIO と連続最適化の系統の標準のベンチマーク。OCT は 53 個、ORCT や Quant-BnB も UCI のデータで比べる
  - name: "COMPAS"
    provider: "ProPublica"
    url: "https://github.com/propublica/compas-analysis"
    features: 年齢、前科の数など（二値化して使うことが多い）
    target: 2年以内の再犯（0/1）
    size: 約7,000行
    usage: OSDT、GOSDT、TreeFARMS など Rudin らの研究と、公平性の研究で使われる
  - name: "FICO HELOC"
    provider: "FICO Explainable Machine Learning Challenge"
    url: "https://community.fico.com/s/explainable-machine-learning-challenge"
    features: 信用履歴の特徴量 23 個
    target: 返済の遅延（0/1）
    size: 10,459行
    usage: OSDT、GOSDT、GOSDT-guesses などで使われる
  - name: "Monk's Problems"
    provider: "UCI"
    url: "https://archive.ics.uci.edu/dataset/70/monk+s+problems"
    features: カテゴリの特徴量 6 個
    target: 2クラス（正解の規則が既知）
    size: 数百行
    usage: 正解の木が分かっているので、最適な木が規則を復元できるかを確かめるのに使う
  - name: "Adult"
    provider: "UCI"
    url: "https://archive.ics.uci.edu/dataset/2/adult"
    features: 年齢、学歴、性別、人種など
    target: 年収が 5 万ドルを超えるか
    size: 約48,000行
    usage: 公平性の制約つきの木（Fair OCT、DPF、FairOCT）で、性別や人種を保護属性にして使う
  - name: "Warfarin（IWPC）"
    provider: "International Warfarin Pharmacogenetics Consortium（PharmGKB・ClinPGx で配布）"
    url: "https://www.clinpgx.org/downloads"
    features: 年齢、体重、遺伝子型など
    target: 適切な投与量（処置の候補を3つに分けて使う）
    size: 約5,700人
    usage: 処方的な木（Kallus、OPT、Jo らの処方の木）で、投与量の選択を処置とみなして使う

metrics:
  - name: "テスト精度"
    how: テストデータでの正解率（不均衡なデータでは F 値や AUC）
    what: 汎化の性能。最適な木は学習データに過剰に合うこともあるので、深さや罰則の値を交差検証で決めて比べる
    refs: Bertsimas & Dunn (2017), van der Linden et al. (2024)
  - name: "学習時の目的関数の値"
    how: 学習データでの誤分類数（＋ 罰則）
    what: 最適化の性能。同じ深さで CART より誤分類が少ないかを見る
    refs: Verwer & Zhang (2019), Aglin et al. (2020)
  - name: "最適性ギャップ・最適性の証明"
    how: （上界 − 下界）÷ 上界、または制限時間内に最適性を証明できたか
    what: 制限時間内に最適解を見つけ、その最適性を示せたか。MIO の系統では途中で打ち切ったときのギャップを報告する
    refs: Aghaei et al. (2025), Demirović et al. (2022)
  - name: "計算時間"
    how: 最適解とその証明が得られるまでの時間（データ数・深さを変えて測る）
    what: どこまで大きなデータ・深い木を厳密に解けるか
    refs: Demirović et al. (2022), Briţa et al. (2025)
  - name: "木の大きさ"
    how: 葉の数、分岐の数、深さ、使う特徴量の数
    what: 解釈しやすさの目安。精度と葉の数のトレードオフの曲線で比べることが多い
    refs: Hu et al. (2019), Lin et al. (2020)
  - name: "後悔・方策の価値"
    how: 最適な処置を選んだときとの結果の差、または推定した方策の価値
    what: 処方的な木の意思決定の良さ
    refs: Bertsimas et al. (2019, OPT), Zhou et al. (2023)

resources:
  - name: "Classification and Regression Trees"
    kind: 書籍
    year: 1984
    url: "https://doi.org/10.1201/9781315139470"
    note: Breiman, Friedman, Olshen, Stone。決定木を貪欲に作る代表的な方法 CART と、コスト複雑度による剪定を示した本。最適決定木の論文の比較の基準
  - name: "Machine Learning Under a Modern Optimization Lens"
    kind: 書籍
    year: 2019
    url: "https://www.dynamic-ideas.com/books/machine-learning-under-a-modern-optimization-lens"
    note: Bertsimas & Dunn。最適な分類木・回帰木・処方的な木を MIO と局所探索で学習する方法をまとめる
  - name: "Mathematical optimization in classification and regression trees"
    kind: サーベイ
    year: 2021
    url: "https://doi.org/10.1007/s11750-021-00594-1"
    note: Carrizosa, Molero-Río, Romero Morales（TOP）。数理最適化で分類木・回帰木を学習する研究を整理する
  - name: "Interpretable machine learning: Fundamental principles and 10 grand challenges"
    kind: サーベイ
    year: 2022
    url: "https://doi.org/10.1214/21-SS133"
    note: Rudin ら（Statistics Surveys）。解釈できる機械学習の課題を10個挙げ、疎で最適な決定木を最初の課題に含める
  - name: "Recent advances in decision trees: an updated survey"
    kind: サーベイ
    year: 2023
    url: "https://doi.org/10.1007/s10462-022-10275-5"
    note: Costa & Pedreira（Artificial Intelligence Review）。最適決定木を含む決定木の研究の最近の動向を整理する
  - name: "Optimal classification trees: a survey"
    kind: サーベイ
    year: 2026
    url: "https://doi.org/10.1007/s10898-026-01655-0"
    note: Li, Qin, Tao, Wu（Journal of Global Optimization）。最適分類木の定式化と解法の研究を整理する
  - name: "ODTlearn"
    kind: ライブラリ
    year: 2023
    url: "https://github.com/D3M-Research-Group/odtlearn"
    note: USC の Vayanos らの Python パッケージ。フローにもとづく最適な分類木・公平な木・頑健な木・処方的な木を MIO で学習する
  - name: "pydl8.5"
    kind: ライブラリ
    year: 2020
    url: "https://github.com/aia-uclouvain/pydl8.5"
    note: DL8.5 の Python 実装。scikit-learn 風の API を備える
  - name: "PySTreeD"
    kind: ライブラリ
    year: 2023
    url: "https://github.com/AlgTUDelft/pystreed"
    note: STreeD の Python 実装。コストを考慮した分類、回帰、処方的な木などの最適な木を動的計画法で学習する
  - name: "GOSDT"
    kind: ライブラリ
    year: 2022
    url: "https://github.com/ubc-systopia/gosdt-guesses"
    note: GOSDT と GOSDT-guesses の実装（pip install gosdt）
  - name: "policytree"
    kind: ライブラリ
    year: 2020
    url: "https://github.com/grf-labs/policytree"
    note: 二重頑健なスコアから最適な方策の木を厳密な探索で学習する（R）
  - name: "Interpretable AI（IAI）"
    kind: ソフトウェア
    year: ""
    url: "https://www.interpretable.ai/"
    note: Bertsimas・Dunn らの商用ソフトウェア。最適な分類木・回帰木・生存木・処方的な木・方策の木を実装する（学術ライセンスあり）
