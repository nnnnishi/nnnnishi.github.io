metrics:
  - name: "regret（累積後悔）"
    axes: 期間 T → 需要を知っている場合の最適な収益との差の累計
    what: 学習しながら価格を決める方策の性能。√T や log T のように、T に対してどの速さで増えるかで比べる
    refs: Besbes & Zeevi (2009), Keskin & Zeevi (2014), Xu & Wang (2021)
  - name: "収益・利益の改善率"
    axes: 方法 → 過去の価格や既存の方法と比べた収益・利益
    what: 実データの研究の主な指標。実験やシミュレーションで、提案した価格での収益を比べる
    refs: Ferreira et al. (2016), Ito & Fujimaki (2017)
  - name: "最適な収益に対する比"
    axes: 方法 → 需要を知っている場合の収益に対する比
    what: 頑健な価格や個別価格の理論研究で、最悪の場合の性能を測る
    refs: Elmachtoub et al. (2021), Chen et al. (2022)
  - name: "最適化した目的関数の値の偏り"
    axes: 予測モデルで計算した収益 → 実際の収益
    what: 予測モデルで最適化した価格の収益は楽観的に見積もられる。その偏りを補正した推定値で評価する
    refs: Ito et al. (2018)
  - name: "オフ方策評価による収益の推定"
    axes: 新しい価格方策 → 過去の記録から推定した期待収益
    what: 実際には試していない価格方策の収益を、逆確率重み付けや二重頑健推定などで推定する
    refs: Elmachtoub et al. (2023), Xu et al. (2026)
  - name: "価格の外挿・範囲"
    axes: 提案した価格 → 過去に観測した価格の範囲から外れる度合い
    what: データにない価格では需要の予測が信用できない。提案した価格が過去の範囲の中にあるか、範囲の推定が適切かを見る
    refs: Ikeda et al. (2023, 2025), Inokuma et al. (2025)
  - name: "公平性・消費者の厚生"
    axes: 価格方策 → グループ間の価格・需要の差, 消費者の余剰
    what: 個別価格が誰に得や損をもたらすかを測る
    refs: Kallus & Zhou (2021), Cohen et al. (2022), Dubé & Misra (2023)

