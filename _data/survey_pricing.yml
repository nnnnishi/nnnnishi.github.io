# /misc/survey/pricing/ のデータ。論文は papers に追記するだけで表に出る（年の降順で自動ソート）。
# category は categories の id のどれか。確認できなかった項目は "" のままにする。

updated: "2026-11-23"

intro: "過去の販売データから需要と価格の関係を推定し、その推定にもとづいて価格を決める研究の文献をまとめたページです。需要を予測してから価格を最適化する方法、学習しながら価格を変える動的価格、顧客ごとに価格を変える個別価格、推定の誤差や価格の内生性への対処を中心に、論文・データセット・評価指標・ライブラリを表にしました。"

categories_note: "論文の表の「系統」は主な貢献で1つに決めています。複数の系統にまたがる論文もあります。"

papers_note: "「需要モデル」は需要（購買確率や販売数）をどう表すか、「最適化・意思決定」は価格をどう決めるか、「制約・設定」は在庫、個別価格、公平性などの条件です。会議名とリンクは arXiv、出版社、Crossref で確認できたものだけを載せています。"

datasets_note: "価格が動いている公開データです。価格を無作為に変えた実験のデータはほとんど公開されておらず、多くは観察データです。観察データの価格は需要の見込みに合わせて決められていることが多く、そのまま回帰すると価格の効果に偏りが出ます。"

metrics_note: "動的価格の理論研究では regret、実データの研究では過去の価格や既存の方法と比べた収益の改善が主な指標です。観察データから価格を決める場合は、新しい価格での収益を実際には観測していないので、その推定の偏りも評価の対象になります。"

footer: "掲載している情報は各論文の arXiv・出版社・Crossref のページで確認した内容にもとづきます。"

categories:
  - id: pto
    label: 予測→最適化
    color: "#0969da"
    idea: 機械学習で価格から需要（販売数）を予測するモデルを作り、そのモデルを目的関数に入れた最適化問題を解いて価格を決める。処方的価格最適化（prescriptive price optimization）とも呼ぶ
    setting: 多数の商品の価格を、交差効果も含めてまとめて決めたいとき
    examples: Ferreira et al. (2016), Ito & Fujimaki (2017), Bertsimas & Kallus (2020)
  - id: shape
    label: 形状制約・価格範囲
    color: "#1a7f37"
    idea: 需要が価格について単調に減る、収益が凹であるといった形の制約を推定に入れる。過去のデータにない価格を提案しないように、探索する価格の範囲を推定する研究も含める
    setting: データにない価格への外挿を避けたいとき、解釈しやすい推定が欲しいとき
    examples: Chen & Gallego (2021), Ikeda et al. (2025)
  - id: robust
    label: 頑健な価格最適化
    color: "#cf222e"
    idea: 需要や購買確率の推定に誤差や分布のずれがあることを前提に、最悪の場合の収益を最大にする
    setting: 推定の誤差が大きいとき、学習時と運用時で市場が変わるとき
    examples: Yabe et al. (2017), Chen et al. (2022), Ikeda et al. (2025)
  - id: personal
    label: 個別価格・オフ方策
    color: "#8250df"
    idea: 顧客の特徴量から価格を決める方策を、過去の価格と購買の記録から学習・評価する。公平性の制約や消費者の厚生も扱う
    setting: 顧客ごとに価格を変えられるとき、過去の価格の記録から新しい価格の方策を評価したいとき
    examples: Elmachtoub et al. (2021), Biggs et al. (2021), Dubé & Misra (2023)
  - id: dynamic
    label: 動的価格・バンディット
    color: "#bc4c00"
    idea: 需要関数を知らないまま、価格を変えて需要を学習しつつ収益を上げる。探索と活用のトレードオフを regret で評価する
    setting: 価格を繰り返し変えられるとき、販売を続けながら需要を学びたいとき
    examples: Besbes & Zeevi (2009), Keskin & Zeevi (2014), Bu et al. (2022)
  - id: contextual
    label: 特徴量つき動的価格
    color: "#bf3989"
    idea: 商品や顧客の特徴量で需要（評価額）が変わるモデルのもとで、顧客や商品が来るたびに価格を決めながら学習する
    setting: 特徴量の次元が高いとき、商品や顧客ごとに需要が違うとき
    examples: Javanmard & Nazerzadeh (2019), Cohen et al. (2020), Ban & Keskin (2021)
  - id: rm
    label: 収益管理・在庫
    color: "#9a6700"
    idea: 在庫や座席などの容量に限りがあり、販売期間が決まっている商品の価格を決める。需要の学習と組み合わせた研究もある
    setting: 売り切りの商品、航空券・ホテル、生鮮品の値下げ
    examples: Gallego & van Ryzin (1994), Ferreira et al. (2018), Badanidiyuru et al. (2018)
  - id: endog
    label: 価格の内生性
    color: "#0a7f86"
    idea: 過去の価格は需要の見込みに合わせて決められていることが多いので、観察データの回帰では価格の効果に偏りが出る。操作変数や DML で価格の効果（価格弾力性）を推定する
    setting: 価格を無作為に変えた実験がなく、観察データしかないとき
    examples: Berry et al. (1995), Hartford et al. (2017), Chernozhukov et al. (2018)

