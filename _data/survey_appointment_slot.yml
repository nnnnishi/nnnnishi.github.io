    note: "ふつうの予約受付は空き時間を細かく分けてしまうとして、患者と医師の双方の希望を使って断片化を減らす予約の入れ方を提案する。シミュレーションで断片化が減り、予約の受入率と稼働率が上がることを示す。単位枠を短くする効果は施術時間の分布がよく推定できている場合に限るとする"
