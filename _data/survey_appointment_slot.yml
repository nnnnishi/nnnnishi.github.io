# /misc/survey/appointment-slot/ のデータ。論文は papers に追記するだけで表に出る（年の降順で自動ソート）。
# category は categories の id のどれか。確認できなかった項目は "" のままにする。
# id は系譜の図と矢印で使う識別子、short は図での呼び名（論文を足すときは必ず付ける）。
# explainer を書くと papers/<explainer>/ の解説ページへリンクする（2026-11-28 時点で解説ページはまだない）。groups は lineage_groups の id。

updated: "2026-11-28"

intro: "美容室やクリニックのように、予約ごとに必要な時間の長さが違い、施術時間分の連続した空きがないと予約を受けられないサービスで、どの枠に予約を入れるかを扱う文献をまとめたページです。空いている時間の合計が足りていても、短い隙間に分かれてしまう（断片化する）と長い予約が入らなくなります。断片化の測り方と抑え方、ホテルの連泊のように連続した区間を予約する収益管理、利用時間のある資源のオンライン配分、顧客の選択を考慮した予約受付、宅配の時間枠管理、計算機の資源断片化を中心に、論文・データセット・評価指標・サーベイを表にしました。"

categories_note: "論文の表の「系統」は主な貢献で1つに決めています。複数の系統にまたがる論文もあります。予約枠の断片化を正面から扱う研究は少ないため、同じ構造を持つ隣の分野（ホテル、宅配、計算機）の研究も載せています。"

papers_note: "「予約の長さ」は1件の予約が占める時間が1枠に固定か、可変で連続した区間を占めるか、「決めること」は受付の可否・提示する枠・枠や部屋の割当のどれを決めるか、「評価」は理論・シミュレーション・実データのどれで検証したかです。会議名とリンクは出版社・RePEc・arXiv のページで確認できたものだけを載せています。"

explainer_note: ""

datasets_note: "予約の長さと予約の時刻がそろった公開データは少なく、この分野の論文の多くは需要分布を仮定したシミュレーションで評価しています。到着や予約の長さの分布を作るのに使える公開データを挙げます。"

metrics_note: "予約を受けた件数だけでなく、資源の稼働率、空きの分かれ方、理論上の最適値との比を合わせて見ます。"

footer: "掲載している情報は各論文の出版社・RePEc・arXiv・Crossref のページで確認した内容にもとづきます。"

categories:
  - id: fragmentation
    label: "断片化の評価と抑制"
    color: "#cf222e"
    idea: "予約後の空き時間がどれだけ細かく分かれるかを指標にし、断片化が小さくなる枠に予約を入れる。部屋や担当者の割当を後回しにして連続した空きを残す方法もある"
    setting: "予約の長さがばらつき、長い予約が入らないことが問題になるとき"
    examples: "Lian et al. (2010), Battiti et al. (2020, 2021), Zhang, Li & Huh (2026)"
  - id: consecutive-rm
    label: "連続区間の収益管理"
    color: "#8250df"
    idea: "ホテルの連泊や鉄道の区間のように、連続した区間をまとめて使う予約をネットワーク収益管理として扱う。区間ごとの機会費用（bid price）や LP にもとづいて受付を決める"
    setting: "予約が複数の時間単位にまたがり、どの予約を受けるかで後の受付が変わるとき"
    examples: "Bitran & Mondschein (1995), Bertsimas & Shioda (2003), Hu & Wu (2025)"
  - id: reusable
    label: "再利用資源のオンライン配分"
    color: "#0a7f86"
    idea: "一定時間使われたあと戻ってくる資源（部屋、車、機器）を、到着する顧客に順に配る。LP にもとづく方策や競争比の保証を示す"
    setting: "利用時間のある資源を、将来の到着を考えながら逐次配るとき"
    examples: "Levi & Radovanović (2010), Gong et al. (2022), Goyal et al. (2025)"
  - id: choice
    label: "選択を考慮した予約受付"
    color: "#0969da"
    idea: "どの枠を提示すると顧客がどれを選ぶかを選択モデルで表し、提示する枠の集合や順序を最適化する。将来の顧客のために需要の集中する枠を残す"
    setting: "顧客が提示された枠から選ぶ予約システムで、何を見せるかを決めるとき"
    examples: "Gupta & Wang (2008), Feldman et al. (2014), Liu et al. (2019)"
  - id: dynamic-appt
    label: "動的な予約スケジューリング"
    color: "#bc4c00"
    idea: "予約受付をマルコフ決定過程として書き、価値関数を線形関数などで近似して（近似動的計画法）解く。複数回の予約や無断キャンセルも扱う"
    setting: "医療機関の予約受付を、将来の需要を考えて逐次決めるとき"
    examples: "Patrick et al. (2008), Liu, Ziya & Kulkarni (2010), Sauré et al. (2012)"
  - id: timeslot
    label: "時間枠管理（宅配）"
    color: "#1a7f37"
    idea: "宅配で顧客に提示する配達時間帯を、配送ルートのコストと将来の受注を考えて決める。受け入れたときの機会費用を近似して提示や価格を決める"
    setting: "時間帯ごとの容量が他の予約との組み合わせで変わるとき"
    examples: "Campbell & Savelsbergh (2005), Agatz et al. (2011), Yang et al. (2016)"
  - id: systems
    label: "区間スケジューリング・計算機資源"
    color: "#57606a"
    idea: "時間区間の要求を順に受けるオンライン区間スケジューリングの理論と、計算機の事前予約や GPU 割当での資源断片化。将来の要求の分布で重み付けした断片化の指標がある"
    setting: "断片化の指標や配置ルールの考え方を他の分野から借りたいとき"
    examples: "Lipton & Tomkins (1994), Castillo et al. (2008), Weng et al. (2023)"

