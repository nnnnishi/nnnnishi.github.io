metrics:
  - name: "受入率"
    what: "予約を申し込んだ件数のうち、成立した件数の割合。断片化を抑える手法の主な評価指標"
    refs: "Lian et al. (2010), Battiti et al. (2021)"
  - name: "稼働率"
    what: "営業時間のうち予約で埋まった時間の割合。受入率が同じでも、長い予約を多く受けたほうが高くなる"
    refs: "Lian et al. (2010)"
  - name: "断片化指数"
    what: "候補の枠に仮に予約を入れたあとに残る、空き時間のかたまりの数。将来需要を考えない、状態だけの指標"
    refs: "Lian et al. (2010)"
  - name: "長さ別の拒否率"
    what: "予約の長さ（泊数、施術時間）ごとに断られた割合を見る。断片化は長い予約ほど断られる形で現れる"
    refs: "Battiti et al. (2021)"
  - name: "充足率・期待収益"
    what: "提供した枠のうち予約で埋まった割合や、受けた予約の収益の期待値。選択を考慮した予約受付の目的関数"
    refs: "Liu et al. (2019), Feldman et al. (2014)"
  - name: "競争比・近似比"
    what: "将来の到着を知っている最適解（または最適なオンライン方策、LP 緩和）に対して、手法が最悪でも何割を得られるか。理論研究の性能保証"
    refs: "Hu & Wu (2025), Goyal et al. (2025)"
  - name: "割当できない容量"
    what: "空いてはいるが、来る要求の大きさに対して小さすぎて使えない容量。将来の要求の分布で重み付けして測る"
    refs: "Weng et al. (2023)"

