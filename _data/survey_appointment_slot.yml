lineage_note: "横は年、縦は系統です。矢印は古い論文から、それを引き継いだ新しい論文へ向かいます。実線は同じグループの続編や手法の直接の拡張、破線は比較相手や出発点に挙げた関係です。これは初版で、論文の本文で関係を確認できたのは RoomTetris の2本だけです。それ以外の矢印は、著者の重なりと研究の流れからの推測（点線）で、本文ではまだ確認していません。2007 年以前の論文は左端の1列にまとめています。研究グループは著者の所属から決めています。破線の枠は解説ページのない論文です（現在はすべて）。"

