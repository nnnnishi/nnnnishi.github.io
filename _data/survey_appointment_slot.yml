lineage_note: "横は年、縦は系統です。矢印は古い論文から、それを引き継いだ新しい論文へ向かいます。実線は同じグループの続編や手法の直接の拡張、破線は比較相手や出発点に挙げた関係です。これは初版です。RoomTetris の2本と、Lian (2010) を引用する研究への矢印は、本文や引用データベース（Google Scholar・OpenAlex・Semantic Scholar）で引用を確認しています。それ以外の矢印は、著者の重なりと研究の流れからの推測（点線）で、本文ではまだ確認していません。2007 年以前の論文は左端の1列にまとめています。研究グループは著者の所属から決めています。論文をクリックすると解説ページへ移動します。"

